#============================================================================================
# X86 only - lede-master (focused fork)
# 每次运行都会重新克隆 coolsnowwolf/lede 最新 master
#============================================================================================

name: X86设备编译固件 (lede-master)

on:
  workflow_dispatch:
  repository_dispatch:
  # 每周日 09:00 UTC（约北京时间 17:00 / 日本 18:00）自动拉取最新源码并编译
  schedule:
    - cron: '0 9 * * 0'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/lede-master/config
  DIY_P1_SH: config/lede-master/diy-part1.sh
  DIY_P2_SH: config/lede-master/diy-part2.sh
  UPLOAD_BIN: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    # schedule 无人工 sender；手动/仓库事件仍限制为仓库所有者触发
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          sudo apt-get clean
          df -hT

      - name: Init environment
        run: |
          set -e
          sudo timedatectl set-timezone "$TZ"
          sudo -E apt-get -y update
          # 固定依赖列表，避免短链失效；覆盖 lede/OpenWrt 常用编译依赖
          sudo -E apt-get -y install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext git \
            gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo mkdir -p /workdir
          sudo chown "$USER:$USER" /workdir

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ccache-x86-lede-${{ hashFiles('config/lede-master/config') }}-${{ github.sha }}
          restore-keys: |
            ccache-x86-lede-${{ hashFiles('config/lede-master/config') }}-
            ccache-x86-lede-
            ccache-x86-

      - name: Clone latest lede source
        working-directory: /workdir
        run: |
          set -e
          echo ">>> Cloning $REPO_URL branch $REPO_BRANCH (latest)"
          git clone -q --single-branch --depth=1 --branch="$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          echo "LEDE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "LEDE_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo ">>> lede commit: $(git rev-parse HEAD)"
          git log -1 --oneline
          df -hT

      - name: Load diy-part1 & feeds
        run: |
          set -e
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config & diy-part2
        run: |
          set -e
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
            cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          else
            echo "ERROR: missing $CONFIG_FILE" >&2
            exit 1
          fi
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig

      - name: Download packages
        run: |
          set -e
          cd openwrt
          make download -j"$(nproc)"
          find dl -size -1024c -exec rm -f {} \; || true

      - name: Compile firmware
        id: compile
        run: |
          set -euo pipefail
          cd openwrt
          export CCACHE_DIR=/workdir/.ccache
          export USE_CCACHE=1
          echo ">>> $(nproc) threads compiling..."
          if make -j"$(nproc)"; then
            echo "status=success" >> "$GITHUB_ENV"
          else
            echo "Parallel build failed, retrying with -j1 V=s ..."
            make -j1 V=s 2>&1 | tee /tmp/openwrt-build-fail.log
            echo "status=success" >> "$GITHUB_ENV"
          fi
          df -hT

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log-${{ github.run_id }}
          path: |
            /tmp/openwrt-build-fail.log
            openwrt/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Organize firmware
        if: env.status == 'success' && !cancelled()
        run: |
          set -e
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "FILE_DATE=$(date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          ls -lh

      - name: Upload firmware artifact
        if: env.UPLOAD_FIRMWARE == 'true' && env.status == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_x86_64_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 7

      - name: Create release
        if: env.UPLOAD_RELEASE == 'true' && env.status == 'success' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x86-${{ env.FILE_DATE }}
          name: OpenWrt X86_64 ${{ env.FILE_DATE }}
          body: |
            - Source: coolsnowwolf/lede (`master`)
            - Commit: `${{ env.LEDE_COMMIT_SHORT }}`
            - Target: x86_64
            - Default IP: `192.168.100.222`
            - Theme: Argon
            - Repo: jianhuashao6/OpenWrt
            - Workflow: build-x86.yml
            - Trigger: ${{ github.event_name }}
          files: ${{ env.FIRMWARE }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 2
          token: ${{ secrets.GITHUB_TOKEN }}
