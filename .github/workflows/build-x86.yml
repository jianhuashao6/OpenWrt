#============================================================================================
# X86 only - lede-master (focused fork)
# 每次运行都会重新克隆 coolsnowwolf/lede 最新 master
#============================================================================================

name: X86设备编译固件 (lede-master)

on:
  workflow_dispatch:
  repository_dispatch:
  # 每周日 09:00 UTC（约北京时间 17:00 / 日本 18:00）自动拉取最新源码并编译
  schedule:
    - cron: '0 9 * * 0'

concurrency:
  group: build-x86-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/lede-master/config
  DIY_P1_SH: config/lede-master/diy-part1.sh
  DIY_P2_SH: config/lede-master/diy-part2.sh
  UPLOAD_BIN: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt-get clean
          df -hT

      - name: Init environment
        run: |
          set -e
          sudo timedatectl set-timezone "$TZ"
          sudo -E apt-get -y update
          # Ubuntu 22.04 常用编译依赖（避免过时/不存在的包名导致安装失败）
          sudo -E apt-get -y install --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget curl ccache \
            libelf-dev ecj fastjar java-propose-classpath python3 python3-dev \
            libsnmp-dev libfuse-dev libreadline-dev liblzma-dev libpam0g-dev \
            libcap-dev libxml2-dev libxslt1-dev zlib1g-dev libzstd-dev \
            xsltproc swig time quilt subversion quilt zip p7zip-full \
            genisoimage qemu-utils
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo mkdir -p /workdir
          sudo chown "$USER:$USER" /workdir
          ccache -M 5G || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ccache-x86-lede-${{ hashFiles('config/lede-master/config') }}-${{ github.sha }}
          restore-keys: |
            ccache-x86-lede-${{ hashFiles('config/lede-master/config') }}-
            ccache-x86-lede-
            ccache-x86-

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-x86-lede-${{ hashFiles('config/lede-master/config') }}-${{ github.run_id }}
          restore-keys: |
            dl-x86-lede-${{ hashFiles('config/lede-master/config') }}-
            dl-x86-lede-

      - name: Clone latest lede source
        working-directory: /workdir
        run: |
          set -e
          echo ">>> Cloning $REPO_URL branch $REPO_BRANCH (latest)"
          # 保留已缓存的 dl/（若存在）
          if [ -d openwrt/dl ]; then
            mv openwrt/dl /tmp/openwrt-dl-cache
          fi
          rm -rf openwrt
          git clone -q --single-branch --depth=1 --branch="$REPO_BRANCH" "$REPO_URL" openwrt
          if [ -d /tmp/openwrt-dl-cache ]; then
            mkdir -p openwrt/dl
            # 合并缓存，不覆盖新空目录结构问题：直接移回
            rsync -a /tmp/openwrt-dl-cache/ openwrt/dl/ || mv /tmp/openwrt-dl-cache/* openwrt/dl/ || true
            rm -rf /tmp/openwrt-dl-cache
          fi
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          echo "LEDE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "LEDE_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo ">>> lede commit: $(git rev-parse HEAD)"
          git log -1 --oneline
          df -hT

      - name: Load diy-part1 & feeds
        run: |
          set -e
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config & diy-part2
        run: |
          set -e
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
            cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          else
            echo "ERROR: missing $CONFIG_FILE" >&2
            exit 1
          fi
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig

      - name: Download packages
        run: |
          set -e
          cd openwrt
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete || true

      - name: Compile firmware
        id: compile
        run: |
          set -euo pipefail
          cd openwrt
          export CCACHE_DIR=/workdir/.ccache
          export USE_CCACHE=1
          export CCACHE_BASEDIR="$PWD"
          echo ">>> $(nproc) threads compiling..."
          START_TS=$(date +%s)
          if make -j"$(nproc)"; then
            echo "status=success" >> "$GITHUB_ENV"
          else
            echo "Parallel build failed, retrying with -j1 V=s ..."
            make -j1 V=s 2>&1 | tee /tmp/openwrt-build-fail.log
            echo "status=success" >> "$GITHUB_ENV"
          fi
          END_TS=$(date +%s)
          echo "BUILD_MINUTES=$(( (END_TS - START_TS) / 60 ))" >> "$GITHUB_ENV"
          ccache -s || true
          df -hT

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log-${{ github.run_id }}
          path: |
            /tmp/openwrt-build-fail.log
            openwrt/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Organize firmware
        if: env.status == 'success' && !cancelled()
        run: |
          set -e
          cd openwrt/bin/targets/*/*
          rm -rf packages
          # 去掉过大的未压缩镜像（保留常用压缩格式与校验文件）
          find . -maxdepth 1 -type f -name '*-ext4-combined.img' -delete || true
          find . -maxdepth 1 -type f -name '*-squashfs-combined.img' -delete || true
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "FILE_DATE=$(date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          ls -lh

      - name: Upload firmware artifact
        if: env.UPLOAD_FIRMWARE == 'true' && env.status == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_x86_64_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 7

      - name: Create release
        if: env.UPLOAD_RELEASE == 'true' && env.status == 'success' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x86-${{ env.FILE_DATE }}
          name: OpenWrt X86_64 ${{ env.FILE_DATE }}
          body: |
            - Source: coolsnowwolf/lede (`master`)
            - Commit: `${{ env.LEDE_COMMIT_SHORT }}`
            - Target: x86_64
            - Default IP: `192.168.100.253`
            - Theme: Argon
            - Build time: ~${{ env.BUILD_MINUTES }} min
            - Repo: jianhuashao6/OpenWrt
            - Trigger: ${{ github.event_name }}
          files: ${{ env.FIRMWARE }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## OpenWrt X86 编译摘要"
            echo
            echo "| 项 | 值 |"
            echo "|----|----|"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 分支 | ${{ github.ref_name }} |"
            echo "| lede | \`${{ env.LEDE_COMMIT_SHORT }}\` |"
            echo "| 状态 | ${{ env.status || 'failed' }} |"
            echo "| 耗时 | ~${{ env.BUILD_MINUTES || '?' }} min |"
            echo "| 默认 IP | 192.168.100.253 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 2
          token: ${{ secrets.GITHUB_TOKEN }}
