#============================================================================================
# X86 only - lede-master（始终拉取最新源码）
# 同步自 cs-star/OpenWrt，并剔除易坏 Go 包
#============================================================================================

name: X86设备编译固件 (lede-master)

on:
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: '0 2 * * 1'

concurrency:
  group: openwrt-x86-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/lede-master/config
  DIY_P1_SH: config/lede-master/diy-part1.sh
  DIY_P2_SH: config/lede-master/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show free space
        run: df -hT

      - name: Init environment
        run: |
          set -e
          sudo -E apt-get -y update
          sudo -E DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool lld llvm mkisofs ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo unzip vim wget \
            xmlto xxd zlib1g-dev file time golang-go || \
          sudo -E DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl ccache libelf-dev qemu-utils \
            p7zip-full genisoimage time subversion swig patch pkgconf golang-go
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$USER" /workdir
          ccache -M "$CCACHE_MAXSIZE" || true
          ccache -z || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ccache-x86-${{ runner.os }}-${{ hashFiles('config/lede-master/config') }}
          restore-keys: |
            ccache-x86-${{ runner.os }}-
            ccache-x86-

      - name: Clone latest lede source
        id: source
        working-directory: /workdir
        run: |
          set -e
          echo ">>> 正在拉取最新 lede 源码 (branch: $REPO_BRANCH)..."
          git clone -q --single-branch --depth=1 --branch="$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

          cd openwrt
          SOURCE_SHA=$(git rev-parse --short HEAD)
          SOURCE_MSG=$(git log -1 --pretty=format:'%s' | tr -d '`|' | head -c 120)
          SOURCE_DATE=$(git log -1 --pretty=format:'%ci')

          echo "----------------------------------------"
          echo "源码仓库 : $REPO_URL"
          echo "分支     : $REPO_BRANCH"
          echo "最新提交 : $SOURCE_SHA"
          echo "提交信息 : $SOURCE_MSG"
          echo "提交时间 : $SOURCE_DATE"
          echo "----------------------------------------"

          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_MSG=$SOURCE_MSG"
            echo "SOURCE_DATE=$SOURCE_DATE"
          } >> "$GITHUB_ENV"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          df -hT

      - name: Load diy-part1 & feeds
        run: |
          set -e
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config & diy-part2
        run: |
          set -e
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
            cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
            echo "已加载自定义 config"
          else
            echo "ERROR: missing $CONFIG_FILE" >&2
            exit 1
          fi
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig
          # defconfig 后再次剔除易坏包
          sed -i \
            -e 's/^CONFIG_PACKAGE_v2ray-plugin=y/# CONFIG_PACKAGE_v2ray-plugin is not set/' \
            -e 's/^CONFIG_PACKAGE_geoview=y/# CONFIG_PACKAGE_geoview is not set/' \
            -e 's/^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set/' \
            .config || true
          rm -rf feeds/packages/net/geoview package/feeds/packages/geoview \
            feeds/helloworld/v2ray-plugin package/feeds/helloworld/v2ray-plugin 2>/dev/null || true
          make defconfig

      - name: Download packages
        run: |
          set -e
          cd openwrt
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete 2>/dev/null || true

      - name: Compile firmware
        id: compile
        run: |
          set -euo pipefail
          cd openwrt
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$CCACHE_DIR"
          echo ">>> $(nproc) threads compiling (ccache enabled)..."
          if make -j"$(nproc)"; then
            echo "status=success" >> "$GITHUB_ENV"
          else
            echo ">>> 并行编译失败，降级为单线程 V=s ..."
            make -j1 V=s 2>&1 | tee /tmp/openwrt-build-fail.log
            echo "status=success" >> "$GITHUB_ENV"
          fi
          echo ">>> ccache 统计："
          ccache -s || true
          df -hT

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log-${{ github.run_id }}
          path: |
            /tmp/openwrt-build-fail.log
            openwrt/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Organize firmware
        if: env.status == 'success' && !cancelled()
        run: |
          set -e
          cd openwrt/bin/targets/*/*
          rm -rf packages
          find . -maxdepth 1 -type f \( \
            -name '*.vdi' -o -name '*.vmdk' -o -name '*.vhdx' -o \
            -name '*rootfs.tar.gz' -o -name '*.manifest' -o \
            -name '*-ext4-combined.img' -o -name '*-squashfs-combined.img' \
          \) -delete 2>/dev/null || true

          FILE_DATE=$(date +%Y%m%d_%H%M)
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "FILE_DATE=$FILE_DATE" >> "$GITHUB_ENV"
          echo ">>> 固件列表："
          ls -lh

      - name: Upload firmware artifact
        if: env.UPLOAD_FIRMWARE == 'true' && env.status == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_x86_64_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 7
          if-no-files-found: error

      - name: Create release
        if: env.UPLOAD_RELEASE == 'true' && env.status == 'success' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x86-${{ env.FILE_DATE }}
          name: OpenWrt X86_64 ${{ env.FILE_DATE }}
          body: |
            ### OpenWrt X86_64 固件

            | 项目 | 内容 |
            |------|------|
            | 源码 | [coolsnowwolf/lede](https://github.com/coolsnowwolf/lede) `master` |
            | 提交 | `${{ env.SOURCE_SHA }}` — ${{ env.SOURCE_MSG }} |
            | 提交时间 | ${{ env.SOURCE_DATE }} |
            | 目标 | x86_64 |
            | 默认 IP | `192.168.100.253` |
            | 主题 | **仅 Argon** |
            | 时区 | Asia/Shanghai |
            | 构建时间 | ${{ env.FILE_DATE }} |

            刷写后访问 http://192.168.100.253  
            默认账号：`root`（密码为空，请立即修改）
          files: ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          {
            echo "### 构建摘要"
            echo ""
            echo "| 项目 | 内容 |"
            echo "|------|------|"
            echo "| 状态 | ${{ env.status || 'failed' }} |"
            echo "| 源码提交 | \`${{ env.SOURCE_SHA }}\` |"
            echo "| 提交信息 | ${{ env.SOURCE_MSG }} |"
            echo "| 构建时间 | ${{ env.FILE_DATE || 'N/A' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 2
          token: ${{ secrets.GITHUB_TOKEN }}
